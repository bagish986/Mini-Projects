<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT preview card component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="cont">
            <img src="images/image-equilibrium.jpg" alt="img">
            
            <h2>Equilibrium #3429</h2>
            <p id="p">Our Equilibrium collection promotes balance and calm.</p>
            <div class="eth">
                <div class="cont-eth">
                    <img src="/front_Mentor/NFT preview card component/images/icon-ethereum.svg" alt="eth">
                    <span>0.041 ETH</span>
                </div>
                <div class="time">
                    <img src="/front_Mentor/NFT preview card component/images/icon-clock.svg" alt="">
                    <span>3 days left</span>
                </div>
            </div>
            <div class="box"></div>
            <div class="name">
                <img src="images/image-avatar.png" alt="avtar">
                <p>Creation of <span>Jules Wyvern</span></p>
            </div>
        </div>
    </div>
</body>
</html>
