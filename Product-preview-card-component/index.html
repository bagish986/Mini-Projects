<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="per-image">
            <img src="/front_Mentor/Product-preview-card-component/images/image-product-desktop.jpg" alt="">
        </div>
        <div class="per-info">
            <p class="product">PERFUME</p>
            <h2 class="per-name">Gabrielle Essence Eau De Parfum</h2>
            <p class="per-desc" >A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL</p>
            <div class="price">
                <h2 class="per-price">$149.99</h2>
                <span>$169.99</span>
            </div>
            <div class="per-button">
                <button><img src="/front_Mentor/Product-preview-card-component/images/icon-cart.svg" alt="Icon"><span>Add to cart</span></button>
            </div>
        </div>
    </div>
</body>
</html>
