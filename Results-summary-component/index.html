<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results-summary-component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer">
        <div class="result">
            <p class="your">Your Result</p>
            <div class="circle">
                <p class="num1">76</p>
                <p class="num2">of 100</p>
            </div>
            <h2 class="great">Great</h2>
            <p class="scored">Your Result 76 of 100 Great You scored higher than 65% of the people who have taken these tests.</p>
        </div>
        <div class="summary">
            <h3>Summary</h3>
            <div class="s1 s">
                <div class="reaction box">
                    <img src="/front_Mentor/Results-summary-component/images/icon-reaction.svg" alt="reaction ic0n">
                    <p>Reaction</p>
                </div>
                <p class="p">80<span>/100</span></p>
            </div>
            <div class="s2 s">
                <div class="memory box">
                    <img src="/front_Mentor/Results-summary-component/images/icon-memory.svg" alt="Memory icon">
                    <p>Memory</p>
                </div>
                    <p class="p">92<span>/100</span></p>
            </div>
               
            <div class="s3 s">
                <div class="verbal box">
                    <img src="/front_Mentor/Results-summary-component/images/icon-verbal.svg" alt="Verbal icon">
                <p>Verbal</p>
                </div>
                <p class="p">61<span>/100</span></p>
            </div>
            <div class="s4 s">
                <div class="visual box">
                    <img src="/front_Mentor/Results-summary-component/images/icon-visual.svg" alt="Visual icon">
                <p>Visual</p>
                </div>
                <p class="p">73<span>/100</span></p>
            </div>
            <button>Continue</button>
        </div>
    </div>
</body>
</html>
