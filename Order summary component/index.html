<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order summary component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="images/illustration-hero.svg"id="img1">
        <div class="content">
            <h2>Order Summary</h2>
            <p id="desc">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like! </p>
            <div class="plan">
                <img src="images/icon-music.svg">
                <div class="amount">
                <p>Annual Plan</p>
                <span>$59.99/year</span>
                </div>
                <a href="#">Change</a>
            </div>
            <button>Proceed to Payment</button>
            <p id="Cancel"> Cancel Order</p>
        </div>
    </div>
</body>
</html>
